[package]
name = "qianmi-ai"
version = "0.6.0"
description = "千迷AI 本機圖片創作工作室"
authors = ["Qianmi AI"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
